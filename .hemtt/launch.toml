[default]
workshop = [
    "450814997",  # CBA_A3
    "463939057",  # ACE3
    "1779063631", # Zeus Enhanced
    "3499977893", # Advanced Development Tools
]
mission = "itc_land_vr_test.VR"

# Used by tools/debugMP.bat: a local dedicated server and two clients
[server]
extends = "default"
parameters = [
    "-server",
    "-port=2302",
    "-loadMissionToMemory",
    "-filePatching",
    #"-cfg=E:\\SteamLibrary\\steamapps\\common\\Arma 3\\basic.cfg",
    "-config=E:\\SteamLibrary\\steamapps\\common\\Arma 3\\server.cfg"
]

[player]
extends = "default"
parameters = [
    "-world=empty",
    "-connect=127.0.0.1",
    "-port=2302"
]

# RHS compatibility (addons/compat_rhs_*). Overlays, chain them after another profile:
#   hemtt launch default rhs          both RHS mods
#   hemtt launch default rhs_usaf     USAF only: the AFRF compat must be skipped without errors
#   hemtt launch server rhs / player rhs
[rhs]
workshop = [
    "843425103", # RHSAFRF
    "843577117", # RHSUSAF
]

[rhs_afrf]
workshop = [
    "843425103", # RHSAFRF
]

[rhs_usaf]
workshop = [
    "843577117", # RHSUSAF
]

# CUP compatibility (addons/compat_cup_*), chained the same way: hemtt launch default cup
[cup]
workshop = [
    "497660133", # CUP Weapons
    "497661914", # CUP Units
    "541888371", # CUP Vehicles
]

# BWMod compatibility (addons/compat_bwa3): hemtt launch default bwa3
[bwa3]
workshop = [
    "1200127537", # BWMod
]

# GTK Boxer compatibility (addons/compat_gtk_boxer): hemtt launch default gtk
[gtk]
workshop = [
    "3780478952", # GTK Boxer
]
